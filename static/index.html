<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 32px;
      color: #111;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #drop-zone {
      position: relative;
      border: 2px dashed #d1d5db;
      border-radius: 10px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      background: #fff;
      transition: border-color 0.15s;
    }
    #drop-zone:hover, #drop-zone.drag-over { border-color: #3b82f6; }
    #drop-zone input[type="file"] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }
    #drop-zone p { font-size: 0.875rem; color: #6b7280; }
    #drop-zone strong { display: block; margin-bottom: 4px; color: #374151; }

    #preview-img {
      display: none;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fafafa;
    }

    button#btn-ocr {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button#btn-ocr:hover:not(:disabled) { background: #1d4ed8; }
    button#btn-ocr:disabled { background: #93c5fd; cursor: not-allowed; }

    #status {
      display: none;
      font-size: 0.82rem;
      padding: 10px 14px;
      border-radius: 8px;
    }
    #status.info    { display: block; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    #status.success { display: block; background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    #status.error   { display: block; background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }

    #output-section { display: none; flex-direction: column; gap: 8px; }
    #output-section.visible { display: flex; }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .output-header span { font-size: 0.8rem; color: #6b7280; }

    #copy-btn {
      padding: 5px 12px;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      color: #374151;
    }
    #copy-btn:hover { border-color: #3b82f6; color: #2563eb; }

    #ocr-output {
      width: 100%;
      min-height: 200px;
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      font-size: 0.875rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      color: #1a1a1a;
      resize: vertical;
    }
  </style>
</head>
<body>

<h1>OCR Studio</h1>

<div class="container">

  <div id="drop-zone">
    <strong>Drop an image here</strong>
    <p>or click to browse — JPG, PNG, WEBP, BMP, TIFF</p>
    <input type="file" id="file-input" accept="image/*" />
  </div>

  <img id="preview-img" alt="Preview" />

  <button id="btn-ocr" disabled>Run OCR</button>

  <div id="status"></div>

  <div id="output-section">
    <div class="output-header">
      <span id="output-meta"></span>
      <button id="copy-btn">Copy</button>
    </div>
    <div id="ocr-output"></div>
  </div>

</div>

<script>
  let currentFile = null;
  let currentText = '';

  const dropZone   = document.getElementById('drop-zone');
  const fileInput  = document.getElementById('file-input');
  const previewImg = document.getElementById('preview-img');
  const btnOcr     = document.getElementById('btn-ocr');
  const statusEl   = document.getElementById('status');
  const outputSect = document.getElementById('output-section');
  const ocrOutput  = document.getElementById('ocr-output');
  const outputMeta = document.getElementById('output-meta');
  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type;
  }

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      setStatus('Please select a valid image file.', 'error');
      return;
    }
    currentFile = file;
    statusEl.className = '';
    outputSect.classList.remove('visible');

    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      previewImg.style.display = 'block';
    };
    reader.readAsDataURL(file);
    btnOcr.disabled = false;
  }

  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

  btnOcr.addEventListener('click', async () => {
    if (!currentFile) return;
    btnOcr.disabled = true;
    btnOcr.textContent = 'Running…';
    setStatus('Running OCR — this may take a few seconds…', 'info');
    outputSect.classList.remove('visible');

    try {
      const fd = new FormData();
      fd.append('image', currentFile);
      const res  = await fetch('/ocr?lang=en&include_blocks=false', { method: 'POST', body: fd });
      const data = await res.json();

      if (!res.ok || !data.success) {
        setStatus('❌ ' + (data.detail || 'OCR failed.'), 'error');
        return;
      }

      currentText = data.text || '';
      ocrOutput.textContent = currentText || '(No text detected.)';
      outputMeta.textContent = `${data.lines_detected} lines · ${data.char_count} chars · ${data.processing_time_s}s`;
      outputSect.classList.add('visible');
      setStatus('', '');

    } catch {
      setStatus('Network error — is the server running?', 'error');
    } finally {
      btnOcr.disabled = false;
      btnOcr.textContent = 'Run OCR';
    }
  });

  document.getElementById('copy-btn').addEventListener('click', async () => {
    if (!currentText) return;
    await navigator.clipboard.writeText(currentText);
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
</script>
</body>
</html>
